<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الموظفين</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="admin-page">
<header class="admin-header">
    <div>
        <h1>إدارة الموظفين</h1>
        <p>عرض جميع الموظفين المسجلين في النظام</p>
    </div>
</header>
<main class="dashboard">
<br>

<a href="/add-employee.html">
    <button class="logout-button">إضافة موظف</button>
</a>
<div style="overflow-x: auto;">

    <table style="width: 100%; border-collapse: collapse; text-align: center;">

        <thead>
            <tr>
                <th style="padding: 12px;">#</th>
                <th style="padding: 12px;">اسم الموظف</th>
                <th style="padding: 12px;">اسم المستخدم</th>
            </tr>
        </thead>

        <tbody id="employeesTable">

            <tr>
                <td colspan="3" style="padding: 20px;">
                    جاري تحميل الموظفين...
                </td>
            </tr>

        </tbody>

    </table>

</div>
</main>
<footer class="admin-footer">
    نظام إدارة مصاريف الموظفين
</footer>
</div>
<script>

fetch("/employees")
    .then(function(response) {
        return response.json();
    })
    .then(function(employees) {

        const table = document.getElementById("employeesTable");

        if (employees.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="3" style="padding: 20px;">
                        لا يوجد موظفين مسجلين
                    </td>
                </tr>
            `;

            return;
        }

        table.innerHTML = "";

        employees.forEach(function(employee, index) {

            table.innerHTML += `
                <tr>
                    <td style="padding: 12px;">${index + 1}</td>
                    <td style="padding: 12px;">${employee.name}</td>
                    <td style="padding: 12px;">${employee.username}</td>
                </tr>
            `;

        });

    })
    .catch(function(error) {

        console.error(error);

        document.getElementById("employeesTable").innerHTML = `
            <tr>
                <td colspan="3" style="padding: 20px;">
                    حدث خطأ أثناء تحميل الموظفين
                </td>
            </tr>
        `;

    });

</script>
</body>
</html>
