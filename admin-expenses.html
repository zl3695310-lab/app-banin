<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصاريف الموظفين</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="admin-page">
<header class="admin-header">
    <div>
        <h1>مصاريف الموظفين</h1>
        <p>عرض جميع المصاريف المسجلة من الموظفين</p>
    </div>
<a href="/admin.html">
    <button class="logout-button">العودة للوحة المسؤول</button>
</a>
</header>
<main class="dashboard">
<div style="overflow-x: auto;">

    <table style="width: 100%; border-collapse: collapse; text-align: center;">

        <thead>
            <tr>
                <th style="padding: 12px;">#</th>
                <th style="padding: 12px;">الموظف</th>
                <th style="padding: 12px;">المبلغ</th>
                <th style="padding: 12px;">الوصف</th>
                <th style="padding: 12px;">التاريخ</th>
                <th style="padding: 12px;">الوصل</th>
                <th style="padding: 12px;">الإجراءات</th>

            </tr>
        </thead>

        <tbody id="expensesTable">

            <tr>
                <td colspan="7" style="padding: 20px;">
                    جاري تحميل المصاريف...
                </td>
            </tr>

        </tbody>

    </table>

</div>
</main>
<footer class="admin-footer">
    نظام إدارة مصاريف الموظفين
</footer>
</div>
<script>

fetch("/all-expenses")
    .then(function(response) {
        return response.json();
    })
    .then(function(expenses) {

        const table = document.getElementById("expensesTable");

        if (expenses.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="7" style="padding: 20px;">
                        لا توجد مصاريف مسجلة
                    </td>
                </tr>
            `;

            return;
        }

        table.innerHTML = "";

        expenses.forEach(function(expense, index) {

            let receipt = "-";
let actions = '<button onclick="deleteExpense(' + expense.id + ')">حذف</button> <button onclick="editExpense(' + expense.id + ')">تعديل</button>';

            if (expense.image) {
                receipt = '<a href="' + expense.image + '" target="_blank">عرض الوصل</a>';
            }

            table.innerHTML += `
                <tr>
                    <td style="padding: 12px;">${index + 1}</td>
                    <td style="padding: 12px;">${expense.employee_name}</td>
                    <td style="padding: 12px;">${expense.amount}</td>
                    <td style="padding: 12px;">${expense.description || "-"}</td>
                    <td style="padding: 12px;">${expense.expense_date}</td>
                    <td style="padding: 12px;">${receipt}</td>
                    <td style="padding: 12px;">${actions}</td>

                </tr>
            `;

        });

    })
    .catch(function(error) {

        console.error(error);

        document.getElementById("expensesTable").innerHTML = `
            <tr>
                <td colspan="7" style="padding: 20px;">
                    حدث خطأ أثناء تحميل المصاريف
                </td>
            </tr>
        `;

    });
function deleteExpense(id) {
if (!confirm("هل أنت متأكد من حذف هذا المصروف؟")) { return; }
fetch("/admin/delete-expense", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: id }) }) .then(function(response) { return response.json(); }) .then(function(result) {
if (result.success) {
    alert("تم حذف المصروف بنجاح");
    location.reload();
} else {
    alert(result.message);
}
}) .catch(function(error) { console.error(error); alert("حدث خطأ أثناء حذف المصروف"); });
}
function editExpense(id) {
window.location.href = "/edit-expense.html?id=" + id;
}
</script>
</body>
</html>
