<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - نظام إدارة مصاريف الموظفين</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Tahoma, sans-serif;
        background: #f4f7fb;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
    }

    .login-container {
        width: 100%;
        max-width: 1050px;
        min-height: 620px;
        background: white;
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
        display: flex;
        direction: ltr;
    }

    .info-section {
        width: 50%;
        background: linear-gradient(145deg, #0878e8, #075dcc);
        color: white;
        padding: 55px 45px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        direction: rtl;
    }

    .logo-box {
        width: 145px;
        height: 145px;
        background: white;
        border-radius: 22px;
        padding: 12px;
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .logo-box img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 15px;
    }

    .info-section h1 {
        font-size: 32px;
        line-height: 1.5;
        margin-bottom: 18px;
    }

    .info-section .description {
        font-size: 17px;
        line-height: 2;
        opacity: 0.95;
        max-width: 430px;
        margin-bottom: 30px;
    }

    .features {
        width: 100%;
        max-width: 350px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .feature {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 12px;
        padding: 13px 18px;
        font-size: 16px;
    }

    .login-section {
        width: 50%;
        padding: 55px 55px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        direction: rtl;
    }

    .login-header {
        margin-bottom: 35px;
    }

    .login-header h2 {
        font-size: 32px;
        color: #172033;
        margin-bottom: 12px;
    }

    .login-header p {
        color: #777;
        font-size: 15px;
    }

    .form-group {
        margin-bottom: 22px;
    }

    .form-group label {
        display: block;
        margin-bottom: 9px;
        color: #333;
        font-size: 15px;
        font-weight: bold;
    }

    .form-group input {
        width: 100%;
        height: 55px;
        border: 1px solid #d9dee8;
        border-radius: 12px;
        padding: 0 16px;
        font-size: 16px;
        outline: none;
        transition: 0.2s;
        background: #fafbfd;
        direction: rtl;
    }

    .form-group input:focus {
        border-color: #0878e8;
        background: white;
        box-shadow: 0 0 0 3px rgba(8, 120, 232, 0.1);
    }

    .options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 25px;
        font-size: 14px;
    }

    .remember {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #666;
    }

    .remember input {
        width: 16px;
        height: 16px;
        cursor: pointer;
    }

    .forgot {
        color: #0878e8;
        text-decoration: none;
    }

    .login-button {
        width: 100%;
        height: 56px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #0878e8, #075dcc);
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 8px 20px rgba(8, 120, 232, 0.25);
    }

    .login-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 25px rgba(8, 120, 232, 0.3);
    }

    .security {
        margin-top: 25px;
        padding: 14px;
        border-radius: 10px;
        background: #f3f9ff;
        color: #555;
        text-align: center;
        font-size: 13px;
    }

    .footer {
        text-align: center;
        margin-top: 25px;
        color: #999;
        font-size: 13px;
    }

    @media (max-width: 850px) {

        body {
            padding: 15px;
        }

        .login-container {
            flex-direction: column;
            max-width: 550px;
        }

        .info-section,
        .login-section {
            width: 100%;
        }

        .info-section {
            padding: 40px 25px;
        }

        .login-section {
            padding: 40px 25px;
        }

        .logo-box {
            width: 110px;
            height: 110px;
            margin-bottom: 20px;
        }

        .info-section h1 {
            font-size: 26px;
        }

        .info-section .description {
            font-size: 15px;
        }

        .login-header h2 {
            font-size: 27px;
        }
    }
</style>
</head>
<section class="info-section">

    <div class="logo-box">
        <img src="logo.jpg" alt="شعار الشركة">
    </div>

    <h1>
        نظام إدارة<br>
        مصاريف الموظفين
    </h1>

    <p class="description">
        نظام متكامل لإدارة ومتابعة مصاريف الموظفين
        بسهولة واحترافية وشفافية.
    </p>

    <div class="features">

        <div class="feature">
            ✓ إدارة المصاريف
        </div>

        <div class="feature">
            ✓ متابعة الموظفين
        </div>

        <div class="feature">
            ✓ تقارير دقيقة
        </div>

    </div>

</section>


<section class="login-section">

    <div class="login-header">
        <h2>تسجيل الدخول</h2>

        <p>
            مرحباً بك، يرجى إدخال بيانات الدخول
        </p>
    </div>


    <form action="/login" method="POST">

        <div class="form-group">

            <label for="username">
                اسم المستخدم
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="أدخل اسم المستخدم"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="أدخل كلمة المرور"
                required
            >

        </div>


        <div class="options">

            <label class="remember">
                <input type="checkbox">
                <span>تذكرني</span>
            </label>

            <a href="#" class="forgot">
                نسيت كلمة المرور؟
            </a>

        </div>


        <button type="submit" class="login-button">
            دخول
        </button>

    </form>


    <div class="security">
        🔒 بياناتك محمية وآمنة
    </div>


    <div class="footer">
        نظام إدارة مصاريف الموظفين
    </div>

</section>
</div>
</body>
</html>
