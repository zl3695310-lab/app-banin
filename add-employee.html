<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة موظف جديد</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="admin-header">

    <div>
        <h1>إضافة موظف جديد</h1>
        <p>إنشاء حساب جديد للموظف</p>
    </div>

    <a href="/employees.html">
        <button class="logout-button">
            العودة للموظفين
        </button>
    </a>

</header>

<main class="dashboard">

    <div class="welcome-box">

        <h2>بيانات الموظف</h2>

        <p>
            أدخل بيانات الموظف لإنشاء حساب جديد.
        </p>

    </div>

    <div class="dashboard-card">

        <form action="/add-employee" method="POST">

            <div class="form-group">

                <label for="name">
                    اسم الموظف
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="أدخل اسم الموظف"
                    required
                >

            </div>

            <div class="form-group">

                <label for="username">
                    اسم المستخدم
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="أدخل اسم المستخدم"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="أدخل كلمة المرور"
                    required
                >

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    تأكيد كلمة المرور
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="أعد كتابة كلمة المرور"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-button"
            >
                حفظ الموظف
            </button>

        </form>

    </div>

</main>

<footer class="admin-footer">
    نظام إدارة مصاريف الموظفين
</footer>
</body>
</html>
